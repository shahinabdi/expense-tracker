[project]
name = "expense-tracker-legacy"
version = "0.1.0"
description = "Expense tracker dashboard - legacy version (before refactoring)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
